---
# Internal ClusterIP Service that the waker uses to reach the
# mc-ragnarok pod. Player traffic does NOT go here: it goes to the
# waker (manifests/waker/), which proxies to this Service.
#
# The selector below matches the label the mc-ragnarok pod carries.
# Confirm with:
#   oc -n minecraft get pod -l app=mc-ragnarok
apiVersion: v1
kind: Service
metadata:
  name: mc-ragnarok
  labels:
    app.kubernetes.io/part-of: mc-ragnarok
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app: mc-ragnarok
  ports:
    - name: mc-java
      port: 25565
      targetPort: 25565
      protocol: TCP
